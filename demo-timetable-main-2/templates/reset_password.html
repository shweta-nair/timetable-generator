<!DOCTYPE html>
<html lang="en">

<head>
    <title>Reset Password – Timetable System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            background: #F2F8FA;
            overflow: hidden;
        }

        :root{
            --primary: #5E8E9A;
            --primary-hover: #3a6672;
            --focus-ring: rgba(150,189,198,0.28);
            --mx: 50%;
            --my: 50%;
        }

        body::before{
            content:"";
            position: fixed;
            inset: 0;
            background:
              linear-gradient(180deg, rgba(8,20,34,0.58) 0%, rgba(8,20,34,0.30) 55%, rgba(8,20,34,0.16) 100%),
              url("{{ url_for('static', filename='auth_rings.png') }}");
            background-size: cover;
            background-position: center;
            filter: saturate(1.05) contrast(1.02);
            z-index: 0;
        }

        body::after{
            content:"";
            position: fixed;
            inset: -10%;
            background:
              radial-gradient(circle at var(--mx) var(--my),
                rgba(240,223,138,0.24) 0%,
                rgba(150,189,198,0.18) 16%,
                rgba(150,189,198,0.00) 42%),
              repeating-radial-gradient(circle at var(--mx) var(--my),
                rgba(255,255,255,0.12) 0 2px,
                rgba(255,255,255,0.00) 2px 12px);
            mix-blend-mode: overlay;
            opacity: 0.65;
            animation: ringVibe 2.8s ease-in-out infinite;
            will-change: transform;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes ringVibe{
            0%   { transform: translate3d(-0.6%,  0.2%, 0) rotate(-0.25deg) scale(1.01); }
            50%  { transform: translate3d( 0.6%, -0.2%, 0) rotate( 0.25deg) scale(1.02); }
            100% { transform: translate3d(-0.6%,  0.2%, 0) rotate(-0.25deg) scale(1.01); }
        }

        .card {
            position: relative;
            z-index: 2;
            background: rgba(255,255,255,0.86);
            border-radius: 14px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 18px 55px rgba(0,0,0,0.26);
            border: 1px solid rgba(255,255,255,0.35);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            animation: popIn 0.55s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes popIn{
            from{ opacity: 0; transform: translateY(14px) scale(0.985); }
            to  { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #5E8E9A, #96BDC6);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 22px; font-weight: 800;
            margin: 0 auto 20px;
            box-shadow: 0 10px 24px rgba(94,142,154,0.32);
        }

        h2 { text-align: center; font-size: 24px; font-weight: 800; color: #1a2e35; margin-bottom: 6px; }
        .sub { text-align: center; font-size: 14px; color: rgba(26,46,53,0.68); margin-bottom: 28px; }

        label { font-size: 13px; font-weight: 600; color: rgba(26,46,53,0.88); display: block; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.42);
            border-radius: 10px; font-size: 14px; font-family: inherit; color: #1a2e35; outline: none;
            transition: transform .12s, box-shadow .2s, border-color .2s, background .2s;
            margin-bottom: 18px;
            background: rgba(255,255,255,0.82);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
        }
        input[type="password"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring), 0 10px 22px rgba(0,0,0,0.10); background: rgba(255,255,255,0.92); }

        .btn {
            width: 100%; padding: 13px; border-radius: 10px; font-size: 15px;
            font-weight: 600; border: none; cursor: pointer; font-family: inherit;
            background: var(--primary); color: #fff; transition: background .2s, transform .12s, box-shadow .2s;
            box-shadow: 0 10px 26px rgba(58,102,114,0.24);
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: translateY(1px); box-shadow: 0 6px 18px rgba(58,102,114,0.22); }

        .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; }
        .flash.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }
        .flash.success { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }

        .back-link { display: block; text-align: center; margin-top: 16px; font-size: 14px; color: rgba(255,255,255,0.92); text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">T</div>
        <h2>Set New Password</h2>
        <p class="sub">Enter and confirm your new password below.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        <form method="POST" action="/reset-password/{{ token }}">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" placeholder="At least 4 characters" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>

            <button type="submit" class="btn">Reset Password</button>
        </form>

        <a href="/login" class="back-link">← Back to login</a>
    </div>
    <script>
      (function () {
        const root = document.documentElement;
        let tx = 0.5, ty = 0.5;
        let cx = 0.5, cy = 0.5;

        function onMove(e){
          const w = window.innerWidth || 1;
          const h = window.innerHeight || 1;
          cx = Math.min(1, Math.max(0, e.clientX / w));
          cy = Math.min(1, Math.max(0, e.clientY / h));
        }

        window.addEventListener('mousemove', onMove, { passive: true });
        window.addEventListener('touchmove', (e) => {
          const t = e.touches && e.touches[0];
          if (t) onMove(t);
        }, { passive: true });

        function tick(){
          tx += (cx - tx) * 0.10;
          ty += (cy - ty) * 0.10;
          const t = performance.now() / 1000;
          const vib = 0.012;
          const vx = Math.sin(t * 7.2) * vib;
          const vy = Math.cos(t * 6.6) * vib;
          root.style.setProperty('--mx', ((tx + vx) * 100).toFixed(2) + '%');
          root.style.setProperty('--my', ((ty + vy) * 100).toFixed(2) + '%');
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      })();
    </script>
</body>

</html>

{% extends "hod_base.html" %}
{% block title %}Settings{% endblock %}

{% block extra_head %}
<style>
  .settings-card { max-width:500px; margin:0 auto; }
  .form-group { margin-bottom:16px; }
  .form-group label { margin-bottom:6px; color:#334155; }
</style>
{% endblock %}

{% block content %}
<div class="page-title">Settings — {{ dept.name }}</div>

<div class="card settings-card">
  <h3>Change Password</h3>
  <form method="POST" action="{{ url_for('hod_settings') }}">
    <div class="form-group">
      <label>Current Password</label>
      <input type="password" name="old_password" required placeholder="Enter current password">
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" name="new_password" required placeholder="Enter new password (min 4 chars)">
    </div>
    <div class="form-group" style="margin-bottom:24px;">
      <label>Confirm New Password</label>
      <input type="password" name="confirm_password" required placeholder="Re-enter new password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Update Password</button>
  </form>
</div>
{% endblock %}
